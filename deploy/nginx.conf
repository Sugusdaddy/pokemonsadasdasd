# Cliente estático para docker compose (en producción va en Vercel con vercel.json).
# Ojo: un add_header dentro de location anula los del server, por eso cada bloque
# vuelve a incluir las cabeceras de seguridad.
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # ficheros con hash en el nombre: no cambian nunca
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # el service worker y la página se revisan siempre (así llegan las actualizaciones)
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
